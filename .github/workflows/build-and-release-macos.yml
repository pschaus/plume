name: Build and Release macOS (Universal DMG Notarized)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Target release tag (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  build-macos:
    name: Build macOS Universal DMG (arm64 + x86_64)
    runs-on: macos-15
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Version
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          fi
          if [[ "$TAG" == v* ]]; then
            VERSION="${TAG#v}"
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
            TAG="v${VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building Plume version $VERSION (tag: $TAG)"

      - name: Setup Apple Developer Keychain & Certificate
        id: setup_cert
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERT_P12_BASE64" ] || [ -z "$CERT_PASSWORD" ]; then
            echo "⚠️ APPLE_CERTIFICATE_P12_BASE64 or APPLE_CERTIFICATE_PASSWORD not set. Falling back to ad-hoc signing."
            echo "has_certificate=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_certificate=true" >> "$GITHUB_OUTPUT"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PWD=$(openssl rand -base64 32)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"

          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          SIGN_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -n 1 | awk -F'"' '{print $2}')
          echo "SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "✅ Found signing identity: $SIGN_IDENTITY"

      - name: Build Universal Plume.app & DMG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "🎨 Generating Plume icons..."
          swift generate_icon.swift
          iconutil -c icns Resources/AppIcon.iconset -o Resources/AppIcon.icns

          echo "🔨 Building Universal Binary (arm64 + x86_64)..."
          swift build -c release --arch arm64 --arch x86_64
          BIN_PATH=".build/apple/Products/Release/Plume"

          APP_BUNDLE="build/Plume.app"
          rm -rf build dist-macos
          mkdir -p "$APP_BUNDLE/Contents/MacOS" "$APP_BUNDLE/Contents/Resources" dist-macos

          cp "$BIN_PATH" "$APP_BUNDLE/Contents/MacOS/Plume"
          cp Resources/Info.plist "$APP_BUNDLE/Contents/Info.plist"
          cp Resources/AppIcon.icns "$APP_BUNDLE/Contents/Resources/AppIcon.icns"
          cp Resources/PlumeLogo.png "$APP_BUNDLE/Contents/Resources/PlumeLogo.png"
          chmod +x "$APP_BUNDLE/Contents/MacOS/Plume"

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$APP_BUNDLE/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$APP_BUNDLE/Contents/Info.plist"

          if [ "${{ steps.setup_cert.outputs.has_certificate }}" = "true" ] && [ -n "${SIGN_IDENTITY:-}" ]; then
            echo "🔏 Signing Plume.app with Developer ID ($SIGN_IDENTITY) and Hardened Runtime..."
            codesign --force --deep --options runtime --timestamp --identifier com.pschaus.Plume --sign "$SIGN_IDENTITY" "$APP_BUNDLE"
          else
            echo "🔏 Ad-hoc signing Plume.app..."
            codesign --force --deep --identifier com.pschaus.Plume --sign - "$APP_BUNDLE"
          fi

          echo "💿 Creating Universal DMG Installer (HFS+ with VolumeIcon & Finder Layout)..."
          DMG_STAGING="build/dmg-staging"
          rm -rf "$DMG_STAGING"
          mkdir -p "$DMG_STAGING"
          cp -R "$APP_BUNDLE" "$DMG_STAGING/Plume.app"
          ln -s /Applications "$DMG_STAGING/Applications"

          DMG_TEMP="build/rw_Plume.dmg"
          DMG_PATH="dist-macos/Plume_${VERSION}_universal.dmg"
          rm -f "$DMG_TEMP" "$DMG_PATH"

          hdiutil create -srcfolder "$DMG_STAGING" -volname "Plume" -fs HFS+ -fsargs "-c c=64,a=16,e=16" -format UDRW -size 35m "$DMG_TEMP"
          DEV_NAME=$(hdiutil attach -readwrite -noverify -noautoopen -nobrowse "$DMG_TEMP" | grep -E '^/dev/' | sed 1q | awk '{print $1}')
          MOUNT_DIR=$(hdiutil info | grep -E "${DEV_NAME}s" | awk '{print $3}' | xargs)
          if [ -z "$MOUNT_DIR" ]; then
            MOUNT_DIR="/Volumes/Plume"
          fi
          echo "Mounted RW DMG at: $MOUNT_DIR ($DEV_NAME)"

          cp Resources/AppIcon.icns "$MOUNT_DIR/.VolumeIcon.icns"
          SetFile -c icnC "$MOUNT_DIR/.VolumeIcon.icns" || true
          if [ -f Resources/dmg_DS_Store ]; then
            cp Resources/dmg_DS_Store "$MOUNT_DIR/.DS_Store"
          fi
          chmod -Rf go-w "$MOUNT_DIR" 2>/dev/null || true
          SetFile -a C "$MOUNT_DIR" || true
          rm -rf "$MOUNT_DIR/.fseventsd" 2>/dev/null || true

          hdiutil detach "$DEV_NAME"
          hdiutil convert "$DMG_TEMP" -format UDZO -imagekey zlib-level=9 -o "$DMG_PATH"
          rm -f "$DMG_TEMP"

          if [ "${{ steps.setup_cert.outputs.has_certificate }}" = "true" ] && [ -n "${SIGN_IDENTITY:-}" ]; then
            codesign --force --timestamp --sign "$SIGN_IDENTITY" "$DMG_PATH"
          fi

          cp "$DMG_PATH" "dist-macos/Plume-macOS.dmg"
          ls -lh dist-macos/

      - name: Notarize and Staple macOS DMG with Apple
        env:
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG_FILE="dist-macos/Plume_${VERSION}_universal.dmg"

          if [ "${{ steps.setup_cert.outputs.has_certificate }}" != "true" ]; then
            echo "ℹ️ Skipping Apple Notarization because no Developer ID certificate was provided."
            exit 0
          fi

          NOTARY_SUCCESS=0
          if [ -n "$API_KEY_BASE64" ] && [ -n "$API_KEY_ID" ] && [ -n "$API_ISSUER" ]; then
            echo "📤 Submitting to Apple Notary via App Store Connect API Key ($API_KEY_ID)..."
            AUTH_KEY_PATH="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
            echo "$API_KEY_BASE64" | base64 --decode > "$AUTH_KEY_PATH"
            if xcrun notarytool submit "$DMG_FILE" --key "$AUTH_KEY_PATH" --key-id "$API_KEY_ID" --issuer "$API_ISSUER" --wait; then
              NOTARY_SUCCESS=1
            fi
            rm -f "$AUTH_KEY_PATH"
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "📤 Submitting to Apple Notary via Apple ID ($APPLE_ID)..."
            if xcrun notarytool submit "$DMG_FILE" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait; then
              NOTARY_SUCCESS=1
            fi
          else
            echo "⚠️ No Apple Notary credentials configured in secrets. Skipping notarization."
          fi

          if [ "$NOTARY_SUCCESS" -eq 1 ]; then
            echo "📎 Stapling notarization ticket to DMG..."
            xcrun stapler staple "$DMG_FILE"
            cp "$DMG_FILE" "dist-macos/Plume-macOS.dmg"
            spctl -a -t open --context context:primary-signature -v "$DMG_FILE" || true
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plume-macos-universal-dmg
          path: dist-macos/*
          if-no-files-found: error
          retention-days: 5

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          # Extract section for current version from CHANGELOG.md, or fallback to full CHANGELOG.md
          NOTES=$(awk "/^## \\[$VERSION\\]/{flag=1; next} /^## \\[/{flag=0} flag" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release Plume $TAG"
          fi

          if gh release view "$TAG" &>/dev/null; then
            gh release upload "$TAG" dist-macos/* --clobber
            gh release edit "$TAG" --title "Plume $TAG" --notes "$NOTES"
          else
            gh release create "$TAG" dist-macos/* --title "Plume $TAG" --notes "$NOTES"
          fi

      - name: Update version.json on gh-pages branch
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          NOTES=$(awk "/^## \\[$VERSION\\]/{flag=1; next} /^## \\[/{flag=0} flag" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release Plume $TAG"
          fi

          python3 - "$VERSION" "$TAG" "$NOTES" << 'EOF'
          import json, sys, datetime
          version, tag, notes = sys.argv[1], sys.argv[2], sys.argv[3].strip()
          path = "website/version.json"
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
          data["version"] = version
          data["name"] = f"Plume {tag}"
          data["title"] = f"Plume {tag}"
          data["published_at"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.000Z")
          data["notes"] = notes
          data["html_url"] = f"https://github.com/pschaus/plume/releases/tag/{tag}"
          data["assets"]["macos"] = f"https://github.com/pschaus/plume/releases/latest/download/Plume_{version}_universal.dmg"
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")
          EOF

          WORKTREE_TMP="$(mktemp -d)"
          cp -R website/* "$WORKTREE_TMP/"
          cp Resources/PlumeLogo.png "$WORKTREE_TMP/logo.png"
          touch "$WORKTREE_TMP/.nojekyll"
          pushd "$WORKTREE_TMP" >/dev/null
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add .
          git commit -m "docs: update version.json for $TAG"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -u origin gh-pages --force
          popd >/dev/null
          rm -rf "$WORKTREE_TMP"

      - name: Clean up temporary Keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP"/*.p12 "$RUNNER_TEMP"/*.p8 || true
