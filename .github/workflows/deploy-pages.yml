name: Deploy Website & User Manual to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'Resources/PlumeLogo.png'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync website/ to gh-pages branch
        run: |
          WORKTREE_TMP="$(mktemp -d)"
          cp -R website/* "$WORKTREE_TMP/"
          cp Resources/PlumeLogo.png "$WORKTREE_TMP/logo.png" 2>/dev/null || true
          touch "$WORKTREE_TMP/.nojekyll"
          pushd "$WORKTREE_TMP" >/dev/null
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add .
          git commit -m "docs: deploy website from main (${GITHUB_SHA::7})"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -u origin gh-pages --force
          popd >/dev/null
          rm -rf "$WORKTREE_TMP"
