name: Deploy Website & User Manual to GitHub Pages

on:
  push:
    branches:
      - main
      - gh-pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Pages directory
        run: |
          if [ -d "website" ]; then
            cp -R Resources/PlumeLogo.png website/logo.png 2>/dev/null || true
            PLAYLOAD_DIR="website"
          else
            PLAYLOAD_DIR="."
          fi
          mkdir -p _site
          cp -R "$PLAYLOAD_DIR"/* _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
